[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-lakehouse-api"
version = "0.1.0"
description = "Local-first CSV ingestion API that writes Parquet datasets"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pyarrow>=17,<25",
    "python-multipart>=0.0.12,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]